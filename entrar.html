<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — WhaLead</title>
<meta name="robots" content="noindex">
<link rel="icon" href="brand.png">
<link rel="stylesheet" href="conta.css">
</head>
<body>
<header>
  <a class="brand" href="index.html"><img src="logo-whalead.png" alt="WhaLead"></a>
  <nav>Não tem conta? <a href="criar-conta.html" style="color:#11b95d;font-weight:650">Criar conta</a></nav>
</header>

<main><div class="caixa">
  <h1>Entrar</h1>
  <p class="sub">Acompanhe sua compra e libere a extensão.</p>

  <form id="f" novalidate>
    <div class="erro" id="erro"></div>
    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
    </div>
    <div class="esq"><a data-abrir-suporte>Esqueci minha senha</a></div>
    <button id="bt" type="submit">Entrar</button>
  </form>

  <p class="pe">Ainda não comprou? <a data-comprar>Quero o WhaLead Pro</a></p>
</div></main>

<footer>© <span data-t="ano">2026</span> WhaLead ·
  <a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a>
  <!-- Decreto 7.962/2013, art. 2º: quem vende tem que estar identificado
       em local de fácil visualização, em toda página que oferta ou fecha. -->
  <br><span style="font-size:12.5px;opacity:.75">Arthur Andrew · São Bernardo do Campo/SP · <a href="termos.html#identificacao">identificação completa do fornecedor</a></span></footer>

<script src="config.js?v=10"></script>
<script src="comum.js?v=10"></script>
<script>
(function () {
  var C = window.WHALEAD_CONFIG || {};
  var f = document.getElementById('f'), bt = document.getElementById('bt'),
      cx = document.getElementById('erro');
  var g = localStorage.getItem('wl_email');
  if (g) document.getElementById('email').value = g;

  /* ---- enquanto o servidor de contas não estiver publicado -------------
     Antes, a pessoa preenchia e-mail e senha, clicava em Entrar e batia
     numa tarja vermelha. Pedir o que não dá para atender é o pior jeito
     de avisar. Agora o aviso vem antes, no lugar do formulário, e com os
     dois caminhos que realmente resolvem alguma coisa.
     Some sozinho no dia em que `api` for preenchido no config.js.       */
  if (!C.api) {
    var caixa = document.createElement('div');
    caixa.className = 'cartao';
    caixa.innerHTML =
      '<p style="margin:0 0 6px;font-weight:700;color:#112b24;font-size:16px">' +
      'A entrada na conta ainda não está disponível</p>' +
      '<p style="margin:0 0 18px">Estamos terminando esta parte. Se você já ' +
      'comprou, <b>a extensão é liberada pelo suporte</b> — escreva e nós ' +
      'respondemos com o seu acesso.</p>' +
      '<a class="btn verde" data-suporte-botao style="display:flex;align-items:center;' +
      'justify-content:center;text-decoration:none">Falar com o suporte</a>' +
      '<a class="btn claro" data-comprar style="display:flex;align-items:center;' +
      'justify-content:center;text-decoration:none">Ainda não comprei</a>';
    f.replaceWith(caixa);
    document.querySelector('.sub').textContent =
      'Já comprou? O suporte libera seu acesso.';
    var pe = document.querySelector('.pe'); if (pe) pe.remove();
    return;   // nada abaixo faz sentido sem servidor
  }

  function erro(t) { cx.textContent = t; cx.className = 'erro on';
    bt.disabled = false; bt.textContent = 'Entrar'; }

  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    cx.className = 'erro';
    if (!C.api) return erro('O sistema de contas ainda não está no ar. ' +
      'Fale com o suporte: ' + (C.suporte || ''));
    bt.disabled = true; bt.textContent = 'Entrando…';
    try {
      var r = await fetch(C.api + '/entrar', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim(),
          senha: document.getElementById('senha').value, apelido: 'Site' })
      });
      var j = await r.json();
      if (!j.ok) return erro(j.erro || 'Não consegui entrar agora. Tente de novo.');
      localStorage.setItem('wl_sessao', j.sessao);
      localStorage.setItem('wl_email', j.email);
      location.href = 'painel.html';
    } catch (e) {
      erro('Não consegui falar com o servidor. Confira sua internet e tente de novo.');
    }
  });
})();
</script>
</body>
</html>
